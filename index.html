<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>子供と食べる栄養AI献立</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f7f9f6;
      color: #333;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      color: #2e5a27;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #4cae4c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background-color: #a0d4a0;
    }
    #result {
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .loading {
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>🥗 子供と食べる栄養AI献立</h1>

  <div class="card">
    <label for="apiKey">Gemini APIキー:</label>
    <input type="text" id="apiKey" placeholder="AQ.Ab8RN6... を貼り付け">
    <button id="generateBtn" onclick="generateMenu()">✨ 今日の夕食献立を作成する</button>
  </div>

  <div id="resultCard" class="card" style="display: none;">
    <div id="result"></div>
  </div>

  <script>
    async function generateMenu() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const btn = document.getElementById('generateBtn');
      const resultCard = document.getElementById('resultCard');
      const resultDiv = document.getElementById('result');

      if (!apiKey) {
        alert('APIキーを入力してください。');
        return;
      }

      btn.disabled = true;
      btn.innerText = '献立を考えています...';
      resultCard.style.display = 'block';
      resultDiv.innerHTML = '<p class="loading">⏳ 栄養バランスの取れた献立を作成中...</p>';

      const promptText = "幼児から小学生くらいの子供が喜ぶ、栄養バランスの取れた今日の夕食献立（主食、主菜、副菜、汁物）と簡単なレシピ、ポイントをわかりやすく日本語で提案してください。";

      try {
        // 最新のGemini API仕様（X-goog-api-keyヘッダーとgemini-flash-latestモデルを使用）
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-goog-api-key": apiKey
          },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  { text: promptText }
                ]
              }
            ]
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        const generatedText = data.candidates[0].content.parts[0].text;

        resultDiv.innerText = generatedText;

      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = '<p style="color: red;">エラーが発生しました。APIキーが正しいか確認するか、もう一度お試しください。</p>';
      } finally {
        btn.disabled = false;
        btn.innerText = '✨ 今日の夕食献立を作成する';
      }
    }
  </script>

</body>
</html>
