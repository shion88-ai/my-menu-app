<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI週間献立プランナー</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #f7f3ee; color: #2a2018; font-family: 'Zen Kaku Gothic New', sans-serif; }
    
    .header { background: #2a2018; color: #f7f3ee; padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
    .header-title { font-family: 'Noto Serif JP', serif; font-size: 1.3rem; font-weight: 600; }
    .header-sub { font-size: 0.72rem; opacity: 0.6; margin-top: 2px; }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }
    .card { background: #fff; border: 1px solid #e0d8d0; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(42,32,24,0.05); }
    .card-title { font-family: 'Noto Serif JP', serif; font-size: 1rem; margin-bottom: 12px; font-weight: 600; }
    
    .tags-area { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; padding: 8px; border: 1.5px solid #e0d8d0; border-radius: 8px; background: #fdfaf7; margin-bottom: 10px; }
    .tag { display: flex; align-items: center; gap: 6px; background: #2a2018; color: #f7f3ee; border-radius: 20px; padding: 3px 10px; font-size: 0.82rem; }
    .tag-remove { background: none; border: none; color: #f7f3ee; cursor: pointer; font-size: 0.9rem; opacity: 0.7; }
    
    .input-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .text-input { flex: 1; border: 1.5px solid #e0d8d0; border-radius: 8px; padding: 10px; font-size: 0.95rem; background: #fdfaf7; color: #2a2018; outline: none; }
    .btn { border: none; border-radius: 8px; padding: 10px 16px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .btn-add { background: #c87941; color: #fff; }
    .btn-gen { background: #2a2018; color: #f7f3ee; font-size: 1rem; padding: 12px 24px; border-radius: 10px; font-family: 'Noto Serif JP', serif; width: 100%; margin-top: 10px; }
    .btn-gen:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt-group { display: flex; flex-direction: column; gap: 4px; }
    .opt-label { font-size: 0.75rem; color: #8a7060; }
    .opt-select { border: 1.5px solid #e0d8d0; border-radius: 8px; padding: 8px; font-size: 0.9rem; background: #fdfaf7; color: #2a2018; outline: none; }
    
    .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .menu-title { font-family: 'Noto Serif JP', serif; font-size: 1.1rem; }
    .menu-hint { font-size: 0.75rem; color: #8a7060; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .day-card { background: #fff; border: 1px solid #e0d8d0; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(42,32,24,0.05); }
    .day-header { background: #2a2018; color: #f7f3ee; padding: 10px 14px; font-family: 'Noto Serif JP', serif; font-size: 0.9rem; }
    
    .meal-row { padding: 12px 14px; border-bottom: 1px solid #f0ebe4; cursor: pointer; transition: background 0.15s; }
    .meal-row:last-child { border-bottom: none; }
    .meal-row:hover { background: #fdf8f3; }
    .meal-lbl { font-size: 0.7rem; color: #c87941; font-weight: 700; margin-bottom: 2px; }
    .meal-name { font-size: 0.95rem; font-weight: 700; color: #2a2018; }
    .meal-desc { font-size: 0.75rem; color: #8a7060; margin-top: 2px; }
    
    /* Modal */
    .overlay { position: fixed; inset: 0; background: rgba(42,32,24,0.6); backdrop-filter: blur(4px); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 14px; }
    .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
    .modal-head { background: #2a2018; color: #f7f3ee; padding: 16px 20px; border-radius: 16px 16px 0 0; position: relative; }
    .modal-title { font-family: 'Noto Serif JP', serif; font-size: 1.2rem; }
    .modal-x { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.2); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
    .modal-body { padding: 20px; }
    .r-title { font-size: 0.75rem; font-weight: 700; color: #c87941; margin: 12px 0 6px; }
    .ing-list { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
    .ing-chip { background: #fdf8f3; border: 1px solid #e0d0c0; border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; }
    .steps { padding-left: 18px; font-size: 0.85rem; line-height: 1.6; }
    .steps li { margin-bottom: 6px; }

    .loading { text-align: center; padding: 40px; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #c87941; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="header">
    <span style="font-size:1.8rem">🍱</span>
    <div>
      <div class="header-title">AI 週間献立プランナー</div>
      <div class="header-sub">食材を入力 → AIが1週間分（朝・昼・夕）の献立とレシピを作成</div>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div class="card-title">冷蔵庫にある食材・使いたい食材</div>
      <div class="tags-area" id="tagsArea"></div>
      <div class="input-row">
        <input type="text" id="ingInput" class="text-input" placeholder="例：豚肉、キャベツ、卵...（Enterで追加）">
        <button class="btn btn-add" onclick="addIngredient()">追加</button>
      </div>

      <div class="options-row">
        <div class="opt-group">
          <span class="opt-label">人数</span>
          <select id="peopleSelect" class="opt-select">
            <option value="1人分">1人</option>
            <option value="2人分">2人</option>
            <option value="3人分">3人</option>
            <option value="4人分（子供対応）" selected>4人（子供対応）</option>
          </select>
        </div>
        <div class="opt-group">
          <span class="opt-label">テーマ・好み</span>
          <select id="prefSelect" class="opt-select">
            <option value="バランス重視">バランス重視</option>
            <option value="子供が喜ぶメニュー" selected>子供が喜ぶメニュー</option>
            <option value="時短・簡単">時短・簡単</option>
            <option value="高タンパク・ヘルシー">高タンパク・ヘルシー</option>
            <option value="ガッツリ系">ガッツリ系</option>
          </select>
        </div>
      </div>

      <button id="genBtn" class="btn btn-gen" onclick="generateMenu()">✨ AIで1週間の献立を作る</button>
    </div>

    <div id="resultArea"></div>
  </div>

  <!-- レシピ詳細モーダル -->
  <div id="modalOverlay" class="overlay" style="display:none;" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-head">
        <div id="modalDayMeal" style="font-size:0.75rem; color:#c87941; font-weight:700;"></div>
        <div id="modalTitle" class="modal-title"></div>
        <button class="modal-x" onclick="document.getElementById('modalOverlay').style.display='none'">✕</button>
      </div>
      <div class="modal-body">
        <div class="r-title">材料（<span id="modalPeople"></span>）</div>
        <div id="modalIngredients" class="ing-list"></div>
        <div class="r-title">作り方</div>
        <ol id="modalSteps" class="steps"></ol>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6IhH5xxFKKo5GwuZXEezxzh7CJoSbiYz0n0tTRodNCjrA";

    let ingredients = ["豚肉", "キャベツ", "卵", "玉ねぎ", "豆腐"];
    let currentMenuData = null;

    window.onload = function() {
      renderTags();
    };

    function addIngredient() {
      const input = document.getElementById("ingInput");
      const val = input.value.trim();
      if (val && !ingredients.includes(val)) {
        ingredients.push(val);
        renderTags();
      }
      input.value = "";
    }

    function removeIngredient(index) {
      ingredients.splice(index, 1);
      renderTags();
    }

    function renderTags() {
      const area = document.getElementById("tagsArea");
      area.innerHTML = ingredients.map((item, i) => `
        <span class="tag">
          ${item}
          <button class="tag-remove" onclick="removeIngredient(${i})">×</button>
        </span>
      `).join("");
    }

    async function generateMenu() {
      const resultArea = document.getElementById("resultArea");
      const genBtn = document.getElementById("genBtn");
      const people = document.getElementById("peopleSelect").value;
      const pref = document.getElementById("prefSelect").value;

      genBtn.disabled = true;
      resultArea.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>AIが1週間分の最適献立を作成中...<br><small style="color:#8a7060">（10〜15秒ほどかかります）</small></div>
        </div>
      `;

      const prompt = `
あなたはプロの料理研究家・栄養士です。
以下の条件に合わせて、月曜日から日曜日までの7日分の「朝食」「昼食」「夕食」の献立と簡単なレシピを作成し、指定のJSON形式のみで出力してください。

【条件】
- 人数: ${people}
- 食事テーマ: ${pref}
- 優先して使いたい食材: ${ingredients.length > 0 ? ingredients.join(", ") : "指定なし"}

【出力フォーマット（必ず以下の厳密なJSON構造のみを出力してください。Markdownなどの装飾は不要）】
{
  "days": [
    {
      "day": "月曜日",
      "breakfast": { "name": "料理名", "desc": "一口説明", "ingredients": ["材料1 100g"], "steps": ["手順1"] },
      "lunch": { "name": "料理名", "desc": "一口説明", "ingredients": ["材料1"], "steps": ["手順1"] },
      "dinner": { "name": "料理名", "desc": "一口説明", "ingredients": ["材料1"], "steps": ["手順1"] }
    }
  ]
}
`;

      try {
        // モデル名を gemini-2.0-flash に変更
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              response_mime_type: "application/json"
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || "APIエラー");
        }

        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text;
        
        currentMenuData = JSON.parse(rawText);
        renderMenu(currentMenuData);

      } catch (err) {
        console.error(err);
        resultArea.innerHTML = `
          <div style="color:#d9534f; text-align:center; padding:20px; background:#fdf2f2; border-radius:8px; border:1px solid #f5c6cb;">
            <strong>献立の生成に失敗しました。</strong><br>
            <small style="color:#666;">詳細: ${err.message}</small>
          </div>
        `;
      } finally {
        genBtn.disabled = false;
      }
    }

    function renderMenu(data) {
      const resultArea = document.getElementById("resultArea");

      let html = `
        <div class="menu-header">
          <div class="menu-title">📅 AIが考えた1週間の献立</div>
          <div class="menu-hint">👆 タップでレシピ表示</div>
        </div>
        <div class="menu-grid">
      `;

      data.days.forEach((d, dayIndex) => {
        html += `
          <div class="day-card">
            <div class="day-header">${d.day}</div>
            <div class="meal-row" onclick="openModal(${dayIndex}, 'breakfast')">
              <div class="meal-lbl">朝食</div>
              <div class="meal-name">${d.breakfast.name}</div>
              <div class="meal-desc">${d.breakfast.desc}</div>
            </div>
            <div class="meal-row" onclick="openModal(${dayIndex}, 'lunch')">
              <div class="meal-lbl">昼食</div>
              <div class="meal-name">${d.lunch.name}</div>
              <div class="meal-desc">${d.lunch.desc}</div>
            </div>
            <div class="meal-row" onclick="openModal(${dayIndex}, 'dinner')">
              <div class="meal-lbl">夕食</div>
              <div class="meal-name">${d.dinner.name}</div>
              <div class="meal-desc">${d.dinner.desc}</div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      resultArea.innerHTML = html;
    }

    function openModal(dayIndex, mealType) {
      if (!currentMenuData) return;
      const dayData = currentMenuData.days[dayIndex];
      const recipe = dayData[mealType];
      const people = document.getElementById("peopleSelect").value;

      const mealNames = { breakfast: "朝食", lunch: "昼食", dinner: "夕食" };

      document.getElementById("modalDayMeal").innerText = `${dayData.day} ・ ${mealNames[mealType]}`;
      document.getElementById("modalTitle").innerText = recipe.name;
      document.getElementById("modalPeople").innerText = people;

      document.getElementById("modalIngredients").innerHTML = recipe.ingredients.map(i => `<span class="ing-chip">${i}</span>`).join("");
      document.getElementById("modalSteps").innerHTML = recipe.steps.map(s => `<li>${s}</li>`).join("");

      document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal(e) {
      if (e.target.id === "modalOverlay") {
        document.getElementById("modalOverlay").style.display = "none";
      }
    }
  </script>
</body>
</html>
