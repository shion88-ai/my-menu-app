<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>献立AIアシスタント</title>
  <style>
    :root {
      --primary: #4a7c59;
      --bg: #f8f6f0;
      --card-bg: #ffffff;
      --accent: #e07a5f;
      --text: #2b2d42;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 40px;
    }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 20px; color: var(--primary); }
    .api-config {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .api-config input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 6px;
      font-size: 0.85rem;
    }
    .btn {
      display: block;
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 3px 8px rgba(224, 122, 95, 0.3);
    }
    .btn:disabled { background: #ccc; box-shadow: none; }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .menu-item {
      border: 1px solid #eef2f5;
      background: #fafafa;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      cursor: pointer;
    }
    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .tag {
      font-size: 0.75rem;
      background: #81b29a;
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
    }
    
    /* 作り方表示用のモーダル（画面オーバーレイ） */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-height: 85vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px;
      box-sizing: border-box;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .close-btn {
      background: #333;
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      font-weight: bold;
    }
    .nutrition-box {
      background: #f0f7f4;
      border-left: 4px solid #81b29a;
      padding: 10px;
      margin: 10px 0;
      font-size: 0.85rem;
    }
    #loading {
      display: none;
      text-align: center;
      margin: 20px 0;
      font-weight: bold;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <h1>🥗 子供と食べる栄養AI献立</h1>

  <!-- 設定エリア -->
  <div class="api-config">
    <label style="font-size: 0.8rem; font-weight: bold;">Gemini APIキー:</label>
    <input type="password" id="apiKey" placeholder="AIキーを入力（自動保存されます）" onchange="saveKey()">
  </div>

  <button id="generateBtn" class="btn" onclick="generateMenu()">✨ 今日の夕食献立を作成する</button>

  <div id="loading">🥦 子供向けの栄養バランスを考慮して献立を作成中...</div>

  <!-- 献立出力エリア -->
  <div id="result"></div>

  <!-- 作り方表示モーダル -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-top:0; font-size:1.2rem;"></h2>
      
      <div id="modalNutrition" class="nutrition-box"></div>

      <h3>🛒 材料（大人2人＋子供）</h3>
      <ul id="modalIngredients" style="padding-left: 20px; font-size: 0.9rem;"></ul>

      <h3>👨‍🍳 作り方</h3>
      <ol id="modalSteps" style="padding-left: 20px; font-size: 0.9rem; line-height: 1.5;"></ol>

      <button class="close-btn" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <script>
    let currentData = null;

    // ページ読み込み時に保存されたAPIキーを復元
    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
    };

    function saveKey() {
      const key = document.getElementById('apiKey').value;
      localStorage.setItem('gemini_api_key', key);
    }

    // AIに献立を生成させるメイン処理
    async function generateMenu() {
      const apiKey = document.getElementById('apiKey').value;
      if (!apiKey) {
        alert('Gemini APIキーを入力してください（Google AI Studioで無料取得できます）');
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('generateBtn').disabled = true;
      document.getElementById('result').innerHTML = '';

      // AIへの指示（プロンプト）
      const prompt = `
        あなたは子育て世帯専門の管理栄養士です。
        小さな子供（幼児〜小学生）がいる家庭向けの今日の夕食献立（主菜1品、副菜1品）を提案してください。
        
        【要件】
        - 子供が食べやすい味付けや工夫を入れること。
        - 野菜やタンパク質などの栄養バランスを考慮すること。
        - 返答は必ず以下のJSON形式のみで出力してください（他の解説文は一切不要）。

        {
          "main": {
            "title": "主菜の料理名",
            "tag": "子供人気",
            "nutrition": "栄養に関するポイント（子供への食べさせやすさなど）",
            "ingredients": ["材料1", "材料2"],
            "steps": ["手順1", "手順2"]
          },
          "side": {
            "title": "副菜の料理名",
            "tag": "栄養満点",
            "nutrition": "栄養ポイント",
            "ingredients": ["材料1", "材料2"],
            "steps": ["手順1", "手順2"]
          }
        }
      `;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text;
        
        // JSON形式の部分のみ抽出
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        currentData = JSON.parse(jsonMatch[0]);

        renderResults(currentData);
      } catch (err) {
        alert('エラーが発生しました。APIキーを確認してください。');
        console.error(err);
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('generateBtn').disabled = false;
      }
    }

    // 画面にカードを表示
    function renderResults(data) {
      const container = document.getElementById('result');
      container.innerHTML = `
        <div class="card">
          <div style="font-weight:bold; margin-bottom:8px;">🍱 本日の主菜</div>
          <div class="menu-item" onclick="openModal('main')">
            <div class="menu-header">
              <span>${data.main.title}</span>
              <span class="tag">${data.main.tag}</span>
            </div>
            <small style="color:#666;">👉 タップして作り方を見る</small>
          </div>

          <div style="font-weight:bold; margin-top:16px; margin-bottom:8px;">🥗 本日の副菜</div>
          <div class="menu-item" onclick="openModal('side')">
            <div class="menu-header">
              <span>${data.side.title}</span>
              <span class="tag">${data.side.tag}</span>
            </div>
            <small style="color:#666;">👉 タップして作り方を見る</small>
          </div>
        </div>
      `;
    }

    // 作り方モーダルを開く
    function openModal(type) {
      if (!currentData) return;
      const item = currentData[type];

      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalNutrition').innerText = '💡 栄養ポイント: ' + item.nutrition;
      
      document.getElementById('modalIngredients').innerHTML = 
        item.ingredients.map(i => `<li>${i}</li>`).join('');

      document.getElementById('modalSteps').innerHTML = 
        item.steps.map(s => `<li>${s}</li>`).join('');

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
